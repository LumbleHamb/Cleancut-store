# CleanCut Suite in the CleanCut store (CasaOS and ZimaOS).
# Every file named below must sit next to this one, or the store build fails:
#   icon.svg, thumbnail.png (784x442), screenshot-1.png ... screenshot-4.png (1280x720).
# Format: v2 store protocol (top-level x-casaos.id, en_US keys, version), the same as the
# developer-submitted apps in IceWhaleTech/CasaOS-AppStore.
#
# Kept identical to the Custom Install (casaos-app.yaml in the app repo) on purpose, so
# people who move over keep their settings:
#   name / service / container  clean-media  -> settings stay in /DATA/AppData/clean-media/config
#   port 8585, /DATA/Media -> /media, /DATA/Media/data -> /data, NET_ADMIN + /dev/net/tun,
#   60 s stop grace, PUID/PGID/TZ.
# The image is pinned to the release tag. The store build adds the matching digest for each
# architecture itself (docker-compose.<arch>.yml in the built store), so no digest here.

name: clean-media
services:
  clean-media:
    image: ghcr.io/lumblehamb/clean-media-stack:1.2.0
    container_name: clean-media
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          memory: 1024M
    cap_add:
      - NET_ADMIN                      # only for the optional VPN and its kill switch (inside the container)
    devices:
      - /dev/net/tun:/dev/net/tun      # the optional VPN's tunnel device
      # Intel/AMD graphics (optional, faster video shrinking): add /dev/dri:/dev/dri here.
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8585
        published: "8585"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media
        target: /media
      - type: bind
        source: /DATA/Media/data
        target: /data
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: The user that owns your movie and show files.
        - container: PGID
          description:
            en_US: The group that owns your movie and show files.
        - container: TZ
          description:
            en_US: Your time zone, for schedules and logs.
      ports:
        - container: "8585"
          description:
            en_US: CleanCut dashboard (the only page you open).
      volumes:
        - container: /config
          description:
            en_US: CleanCut's settings, word list, history and backups (small).
        - container: /media
          description:
            en_US: >-
              Your existing movie and show folders, so CleanCut can clean them. Optional.
              CleanCut adds a clean audio track to each file and keeps the original audio
              inside it as a backup track.
        - container: /data
          description:
            en_US: >-
              Where new titles are saved if you turn on finding and downloading
              (on your big media drive). Optional.
      devices:
        - container: /dev/net/tun
          description:
            en_US: >-
              Network tunnel for the optional VPN. Only used if you turn the VPN on.

x-casaos:
  id: org.harrelsons.cleancut
  main: clean-media
  index: /
  port_map: "8585"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/LumbleHamb/cleancut-store@main/Apps/CleanCut/icon.svg
  thumbnail: https://cdn.jsdelivr.net/gh/LumbleHamb/cleancut-store@main/Apps/CleanCut/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/LumbleHamb/cleancut-store@main/Apps/CleanCut/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/LumbleHamb/cleancut-store@main/Apps/CleanCut/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/LumbleHamb/cleancut-store@main/Apps/CleanCut/screenshot-3.png
    - https://cdn.jsdelivr.net/gh/LumbleHamb/cleancut-store@main/Apps/CleanCut/screenshot-4.png
  title:
    en_US: CleanCut Suite
  tagline:
    en_US: Profanity filter for Plex. Mutes the swearing before your kids press play.
  description:
    en_US: >-
      CleanCut mutes the swearing in the movies and shows on your Plex before
      your kids press play. Choose the folders your movies and shows are in, and
      CleanCut mutes each bad word in the audio (the word, not the whole line)
      and stars it out in the subtitles. You pick the level (Lite, Moderate or
      Strict) and can add your own words. The picture is never re-encoded, and
      the original audio stays inside each file as a backup track, so you can
      undo a mute later. No subtitles? CleanCut can listen to the audio itself,
      on your server. Nothing is uploaded.


      Clean titles get a Kid Safe label in Plex, so kid profiles only see titles
      that are cleaned and within the age limit you choose (for example, up to
      PG). New titles stay hidden from kids until they are cleaned.


      Optional: CleanCut can also find and download new movies and shows for
      you, and clean them as they arrive. It comes with no search sites; you add
      the ones you have permission to use. A VPN is optional and recommended to
      keep your home address private while CleanCut downloads.


      Free trial: 3 movies and 10 TV episodes, every feature, no card. Then
      $19.99 once - launch price. The price goes up after launch; buy now and
      it's yours for life, with free updates. There is no CleanCut subscription.
      You need Plex Media Server. Limiting kid profiles by label needs Plex Pass
      (Plex Pass and a VPN are separate services from other companies).
      30-day money-back guarantee.
  tips:
    before_install:
      en_US: >-
        You need Plex Media Server and at least 4 GB of RAM (a Raspberry Pi 5
        or a 64-bit Intel/AMD mini-PC). CleanCut sees your movies and shows
        under /media (your /DATA/Media folder). If they are on another drive,
        change the /media folder under Volumes before installing. CleanCut
        rewrites those files to add the clean audio track, so back up anything
        irreplaceable first. The NET_ADMIN permission and /dev/net/tun are only
        used by the optional VPN and its kill switch. After installing, open
        CleanCut on port 8585 and follow the setup guide (about ten minutes).
        Guide: https://shop.harrelsons.org/cleancut/install/
  author: CleanCut Suite
  developer: CleanCut Suite
  category: Media
  architectures:
    - amd64
    - arm64
  version: "1.2.0"
  update_at: "2026-10-18"
  release_notes:
    en_US: |-
      - New: CleanCut Cleaner ($14.99), just the cleaning for the movies already on your Plex. Upgrade to Suite any time for $5.
      - Your license key now decides the edition; existing keys stay Suite.
      - Setup now starts with one question: clean the movies and shows already on your Plex, or also find and download new ones.
      - Choose your own movie and show folders to clean. The original audio stays inside each file as a backup.
      - Video shrinking stays off for your own folders unless you turn it on.
      - Search sites: CleanCut adds none for you. Settings lists every public site A to Z, and you add the ones you want.
      - Downloads now stop sharing with other people as soon as they finish. To change that, use the new setting Keep sharing after a download finishes (off by default).
      - Family collections have new names.
  website: https://shop.harrelsons.org/cleancut/
  repo: https://github.com/LumbleHamb/cleancut-store
  support: https://shop.harrelsons.org/cleancut/help/
  docs: https://shop.harrelsons.org/cleancut/install/
