version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: cleancut-cleancut_server_1
      APP_PORT: 8585

  server:
    image: ghcr.io/lumblehamb/clean-media-stack:1.2.1@sha256:955fd885f4e0d4904687f0433d5c9c4ad5cb4a63b854247eee1868deedadae74
    restart: on-failure
    stop_grace_period: 60s
    cap_add:
      - NET_ADMIN # only for the optional VPN and its kill switch; the VPN creates its own tunnel device
    environment:
      # Umbrel's shared storage is owned by 1000:1000, the same IDs the official Plex app uses.
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Movies and shows: the official Plex, Jellyfin, Radarr and Sonarr apps all mount Umbrel's
      # shared Downloads folder (${UMBREL_ROOT}/data/storage/downloads, which current umbrelOS
      # rewrites to its Home/Downloads folder) and keep the library in it (Radarr: /downloads/movies).
      # CleanCut mounts the same folder, so it sees and cleans exactly the files Plex sees.
      # It is mounted twice: at /media, where CleanCut looks by default, and at /downloads, so the
      # file paths Plex reports (/downloads/...) also exist inside CleanCut.
      # Read-write on purpose: CleanCut adds a clean audio track to each file and keeps the
      # original audio inside the file as a backup track.
      - ${UMBREL_ROOT}/data/storage/downloads:/media
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      # Optional: where CleanCut saves new titles if you turn on finding and downloading.
      - ${UMBREL_ROOT}/data/storage/downloads/data:/data
